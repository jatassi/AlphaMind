name: ci

# PR-gating workflow. Lint runs on Linux (matches existing manylinux ta-lib wheel
# story); pytest runs on Windows (matches production host). Both gate PR merge to
# main via the repo's documented PR-only policy (see CLAUDE.md "Branch policy").
#
# Path filters: changes confined to docs, archives, .claude/ tooling, or the
# top-level audit HTML do not affect runtime behavior and skip CI. Anything that
# can change runtime — src, tests, config, prompts, scripts, dependency files,
# alembic.ini, .importlinter, the workflow itself — runs the full chain.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.archive/**'
      - '.claude/**'
      - 'audit-*.html'
      - '.gitignore'
      - '.env.example'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.archive/**'
      - '.claude/**'
      - 'audit-*.html'
      - '.gitignore'
      - '.env.example'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + mypy + import-linter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        # Pinned to match local dev. pyproject.toml's `requires-python = ">=3.13"`
        # would otherwise let uv pick Python 3.14 from the hosted toolcache, which
        # introduces a runtime variable CI failures can't be cleanly attributed to.
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dev dependencies
        # ta-lib ships manylinux2014 wheels for cp313, so no native libta-lib
        # install is needed on the GitHub-hosted Linux runner.
        run: uv sync

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format (verify)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: lint-imports
        run: uv run lint-imports

  frontend:
    name: bun lint + format-check + typecheck + test (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run when frontend files change — saves CI minutes on Python-only PRs.
    # Note: on `pull_request` this filter evaluates the PR's full diff, not just
    # the triggering commit. A PR that started as Python-only stays fast even if
    # a docs follow-up is pushed.
    #
    # Story 04d (ALP-670) extended the lint-only job with `bun run typecheck`
    # (tsc -b --noEmit) and `bun run test` (Vitest run mode) — every push
    # against the foundation now exercises both the TypeScript compiler and
    # the smoke + webauthn unit tests.
    steps:
      - uses: actions/checkout@v5

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: src/alphamind/command_center/frontend
        run: bun install --frozen-lockfile

      - name: ESLint
        working-directory: src/alphamind/command_center/frontend
        run: bun run lint

      - name: Prettier (format check)
        working-directory: src/alphamind/command_center/frontend
        run: bun run format:check

      - name: TypeScript (tsc -b --noEmit)
        working-directory: src/alphamind/command_center/frontend
        run: bun run typecheck

      - name: Vitest
        working-directory: src/alphamind/command_center/frontend
        run: bun run test

  test:
    name: pytest (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        # Pinned to match local dev. pyproject.toml's `requires-python = ">=3.13"`
        # would otherwise let uv pick Python 3.14 from the hosted toolcache, which
        # introduces a runtime variable CI failures can't be cleanly attributed to.
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dev dependencies
        # First-pass: rely on PyPI cp313 win_amd64 wheels (including ta-lib's
        # prebuilt wheel). If a future ta-lib release drops the Windows wheel,
        # add a `Install ta-lib via vcpkg` step before this and pin the wrapper
        # version.
        run: uv sync

      - name: pytest
        # -n auto allocates one worker per core.
        run: uv run pytest -n auto
