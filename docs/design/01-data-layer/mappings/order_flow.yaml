- entity: TradeFlowAggregate
  spec_id: Q2:2a
  description: Q2:2a — Aggressor-side trade flow with size distribution and directional signals.
  is_primary_entity: true
  primary_source: Alpaca IEX trades (free) + Polygon 1-min bars
  fallback_source: Polygon 1-min bar volume/direction approximation
  cadence: Every invocation
  feasibility: MEDIUM — IEX covers ~2-3% of volume; supplement with bar-level approximation
  fields:
  - target_field: flow_1h
    target_type: Optional[FlowWindow]
    description: Last 1 hour — most recent directional read
    source: Alpaca + Derived
    source_endpoint: GET /v2/stocks/{ticker}/trades (Alpaca) + GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to}
    source_field: Computed
    source_type: N/A
    transform: 'Distillation: Lee-Ready algorithm on Alpaca IEX trades for aggressor classification. Supplement with bar-level
      direction from Polygon 1-min bars (close vs open → buy/sell pressure proxy).'
  - target_field: flow_4h
    target_type: Optional[FlowWindow]
    description: Last 4 hours — aligns with 4h candle timeframe
    source: Alpaca + Derived
    source_endpoint: GET /v2/stocks/{ticker}/trades (Alpaca) + GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to}
    source_field: Computed
    source_type: N/A
    transform: 'Distillation: Lee-Ready algorithm on Alpaca IEX trades for aggressor classification. Supplement with bar-level
      direction from Polygon 1-min bars (close vs open → buy/sell pressure proxy).'
  - target_field: flow_session
