- entity: LiquiditySnapshot
  spec_id: Q2:2b
  description: Q2:2b — Bid-ask spread and liquidity scoring from NBBO snapshots.
  is_primary_entity: true
  primary_source: Polygon Stocks Starter (snapshot)
  fallback_source: Alpaca latest quote
  cadence: Every invocation
  feasibility: MEDIUM — NBBO from snapshot only, no depth
  fields:
  - target_field: current_spread_bps
    target_type: float
    description: Current bid-ask spread in basis points.
    source: Polygon + Derived
    source_endpoint: GET /v2/snapshot/locale/us/markets/stocks/tickers/{ticker}
    source_field: Computed
    source_type: varies
    transform: 'Distillation: computed from spread and volume data.'
  - target_field: avg_spread_1h_bps
    target_type: float
    description: Average spread over the last hour
    source: Polygon + Derived
    source_endpoint: GET /v2/snapshot/locale/us/markets/stocks/tickers/{ticker}
    source_field: Computed
    source_type: varies
    transform: 'Distillation: computed from spread and volume data.'
  - target_field: avg_spread_session_bps
    target_type: float
    description: Average spread for the current/most recent session
    source: Polygon + Derived
    source_endpoint: GET /v2/snapshot/locale/us/markets/stocks/tickers/{ticker}
    source_field: Computed
    source_type: varies
    transform: 'Distillation: computed from spread and volume data.'
  - target_field: avg_spread_20d_bps
    target_type: float
    description: 20-day trailing average spread — the baseline
    source: Polygon + Derived
    source_endpoint: GET /v2/snapshot/locale/us/markets/stocks/tickers/{ticker}
    source_field: Computed
    source_type: varies
    transform: 'Distillation: computed from spread and volume data.'
  - target_field: spread_z_score
    target_type: float
    description: Current spread vs. 20-day average, in standard deviations.
    source: Polygon + Derived
    source_endpoint: GET /v2/snapshot/locale/us/markets/stocks/tickers/{ticker}
    source_field: Computed
    source_type: varies
    transform: 'Distillation: computed from spread and volume data.'
  - target_field: spread_widening_alert
    target_type: bool
    description: True when spread has widened >50% vs. 20-day average.
    source: Polygon + Derived
    source_endpoint: GET /v2/snapshot/locale/us/markets/stocks/tickers/{ticker}
    source_field: Computed
    source_type: varies
    transform: 'Distillation: computed from spread and volume data.'
  - target_field: book_imbalance_ratio
    target_type: Optional[float]
    description: Bid depth / (bid depth + ask depth) at best levels. Range 0.0–1.0. >0.6 = more resting buy orders (bullish
      lean), <0.4 = more resting sell. None when only NBBO is available.
    source: Polygon + Derived
    source_endpoint: GET /v2/snapshot/locale/us/markets/stocks/tickers/{ticker}
    source_field: Computed
    source_type: varies
    transform: 'Distillation: computed from spread and volume data.'
  - target_field: liquidity_score
    target_type: float
