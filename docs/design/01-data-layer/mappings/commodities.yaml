- entity: CrudeOil
  spec_id: Q8:8a
  description: Q8:8a — WTI/Brent prices, futures curve, spreads, and EIA inventory.
  is_primary_entity: true
  primary_source: EIA + FRED
  fallback_source: Polygon (commodity ETF tickers)
  cadence: Daily (prices), Weekly (inventory/production)
  feasibility: HIGH
  fields:
  - target_field: wti_spot_price
    target_type: float
    description: Current WTI spot price ($/barrel)
    source: EIA + FRED
    source_endpoint: GET /v2/petroleum/pri/spt/data/?frequency=daily&facets[series][]=RWTC
    source_field: response.data[].value
    source_type: number
    transform: 'Distillation: derived from EIA petroleum data and FRED commodity series.'
  - target_field: wti_prior_close
    target_type: float
    description: Prior day close ($/barrel)
    source: EIA + FRED
    source_endpoint: GET /v2/petroleum/pri/spt/data/?frequency=daily&facets[series][]=RWTC
    source_field: response.data[].value
    source_type: number
    transform: 'Distillation: derived from EIA petroleum data and FRED commodity series.'
  - target_field: wti_change_pct
    target_type: float
    description: Daily change percentage
    source: EIA + FRED
    source_endpoint: GET /v2/petroleum/pri/spt/data/?frequency=daily&facets[series][]=RWTC
    source_field: response.data[].value
    source_type: number
    transform: 'Distillation: derived from EIA petroleum data and FRED commodity series.'
  - target_field: wti_change_atr
    target_type: float
    description: Daily change in ATR-equivalent multiples (for
    source: EIA + FRED
