  fallback_source: N/A
  cadence: TBD
  feasibility: TBD
  fields:
  - target_field: index
    target_type: IndexName
    description: ''
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Derived from reference data changes
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: event_type
    target_type: str
    description: '"add" | "remove"'
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Derived from reference data changes
