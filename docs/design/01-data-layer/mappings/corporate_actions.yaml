- entity: BuybackBlackout
  spec_id: N/A (supporting type)
  description: A blackout period when corporate buybacks are restricted.
  is_primary_entity: false
  primary_source: TBD
  fallback_source: N/A
  cadence: TBD
  feasibility: TBD
  fields:
  - target_field: blackout_start
    target_type: datetime
    description: Start of blackout (typically earnings announcement - 14 days)
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: 'Derived from SEC filings (10-Q/10-K: insider trading policy) + earnings calendar (blackout windows)'
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: blackout_end
    target_type: datetime
    description: End of blackout (typically +2 trading days after earnings release)
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: 'Derived from SEC filings (10-Q/10-K: insider trading policy) + earnings calendar (blackout windows)'
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: reason
    target_type: str
    description: '"earnings_blackout" | "material_event" | "custom"'
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: 'Derived from SEC filings (10-Q/10-K: insider trading policy) + earnings calendar (blackout windows)'
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: description
    target_type: str
    description: Human-readable explanation
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: 'Derived from SEC filings (10-Q/10-K: insider trading policy) + earnings calendar (blackout windows)'
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
- entity: RegulatoryEvent
  spec_id: N/A (supporting type)
  description: A single regulatory filing event.
  is_primary_entity: false
  primary_source: TBD
  fallback_source: N/A
  cadence: TBD
  feasibility: TBD
  fields:
  - target_field: filing_type
    target_type: RegulatoryFilingType
    description: ''
    source: SEC EDGAR + Finnhub
    source_endpoint: SEC EDGAR /submissions + Finnhub /stock/filings
    source_field: facts.us-gaap.{concept}.units.{unit}[].val
    source_type: number/string
    transform: 'SEC EDGAR: submissions.filings.recent for filing type, date, URL. Finnhub: /stock/filings for structured filing
      data.'
  - target_field: filing_date
    target_type: datetime
    description: When filed with SEC (UTC)
    source: SEC EDGAR + Finnhub
    source_endpoint: SEC EDGAR /submissions + Finnhub /stock/filings
    source_field: facts.us-gaap.{concept}.units.{unit}[].val
    source_type: number/string
    transform: 'SEC EDGAR: submissions.filings.recent for filing type, date, URL. Finnhub: /stock/filings for structured filing
      data.'
  - target_field: announcement_date
    target_type: Optional[datetime]
    description: When publicly announced (may differ from filing)
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: 'Finnhub: sec-filings + company-news | SEC EDGAR: 8-K filings'
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: event_type
    target_type: Optional[EventType]
    description: Classification of the material event (if 8-K)
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: 'Finnhub: sec-filings + company-news | SEC EDGAR: 8-K filings'
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: description
    target_type: str
    description: Human-readable summary for LLM consumption
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: 'Finnhub: sec-filings + company-news | SEC EDGAR: 8-K filings'
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: url
    target_type: str
    description: Link to EDGAR filing or news source
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: 'Finnhub: sec-filings + company-news | SEC EDGAR: 8-K filings'
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: market_impact_estimate
    target_type: SignalStrength
    description: ''
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: 'Finnhub: sec-filings + company-news | SEC EDGAR: 8-K filings'
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
