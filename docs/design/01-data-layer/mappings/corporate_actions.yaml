- entity: IndexRebalance
  spec_id: Q12:12a
  description: Q12:12a — Index add/remove events with estimated passive flow magnitude.
  is_primary_entity: true
  primary_source: Index provider announcements + Finnhub
  fallback_source: SEC EDGAR, financial news APIs
  cadence: Event-driven
  feasibility: MEDIUM — S&P/NASDAQ announce publicly
  fields:
  - target_field: current_indices
    target_type: list[IndexName]
    description: Which major indices (SP500, NASDAQ100, etc.) currently include this ticker. Updated as adds/removes are announced
      and become effective.
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: pending_adds
    target_type: list[IndexAddRemove]
    description: Announced (but not yet effective) additions to indices. These create forward expectations of passive flow
      magnitude.
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: pending_removes
    target_type: list[IndexAddRemove]
    description: Announced removals. Sellers have time to front-run; the stock often starts declining before the effective
      date as forward-looking traders sell ahead.
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: sp500_weight_pct
    target_type: float
    description: Current S&P 500 weight (for universe names in the index)
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: nasdaq100_weight_pct
    target_type: float
    description: Current NASDAQ-100 weight
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: russell_weight_pct
    target_type: float
    description: Current Russell 1000/2000 weight (whichever is applicable)
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: next_quarterly_rebalance_date
    target_type: Optional[date]
    description: When is the next scheduled index reconstitution / quarterly rebalance that might affect this ticker's weight.
      Used for flagging "rebalance date proximity."
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: recent_weight_change_pct
    target_type: Optional[float]
    description: Percentage change in index weight from the most recent rebalance. Positive = heavier, negative = lighter.
      Even without adds/removes, market cap changes create rebalance flows.
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: recent_stock_split
    target_type: bool
    description: True if stock split occurred recently (affects index weight calc)
    source: Polygon
    source_endpoint: GET /v3/reference/splits?ticker={ticker}
    source_field: Computed
    source_type: varies
    transform: 'Polygon: /v3/reference/splits. Fields: execution_date, split_from, split_to.'
  - target_field: recent_share_offering
    target_type: bool
    description: True if secondary offering priced recently
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: buyback_reducing_shares
    target_type: bool
    description: True if active buyback is reducing float
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: estimated_flow_magnitude_usd
    target_type: Optional[float]
    description: 'Rough estimate of passive fund flow magnitude (in USD millions) when a pending add becomes effective. Derived
      from: estimated AUM of index × weight change. Larger flow magnitude = stronger and more su...'
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: anomalies
    target_type: list[AnomalyFlag]
    description: ''
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
- entity: BuybackProgram
  spec_id: Q12:12b
  description: Q12:12b — Corporate buyback authorization, execution pace, and blackout windows.
  is_primary_entity: true
  primary_source: SEC EDGAR (10-Q/10-K free)
  fallback_source: Earnings transcript extraction
  cadence: Quarterly
  feasibility: MEDIUM — authorization from filings, blackout from earnings calendar
  fields:
  - target_field: program_active
    target_type: bool
    description: True if an authorized buyback program exists
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: authorization_remaining_usd
    target_type: Optional[float]
    description: Remaining authorization size (in USD millions). When authorization is nearly exhausted, the company may announce
      a new program soon (forward signal).
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: authorization_remaining_shares
    target_type: Optional[int]
    description: Remaining authorization in share count (alternative/complementary view).
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: recent_buyback_pace_monthly_usd
    target_type: Optional[float]
    description: Average monthly buyback spend over the trailing 3 months (USD millions). Combined with daily volume, this
      indicates buyback as % of volume.
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: buyback_as_pct_daily_volume
    target_type: Optional[float]
    description: Estimated buyback execution as percentage of typical daily volume. For mega-caps (AAPL, GOOG, META), this
      can be 5–15% of daily volume. Presence/absence shifts supply/demand balance materially.
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: current_blackout_window
    target_type: Optional[BuybackBlackout]
    description: If in a blackout period, details on when it started and when it ends. Typically ~2 weeks before earnings
      through ~2 trading days after.
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: next_blackout_window
    target_type: Optional[BuybackBlackout]
    description: Next known blackout (usually around next earnings announcement).
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: blackout_lift_date
    target_type: Optional[datetime]
    description: Estimated datetime when the current blackout window closes and buybacks can resume. Useful for near-term
      flow expectations.
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: has_10b5_1_plan
    target_type: bool
    description: True if the company has pre-scheduled automatic buyback plans
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: plan_expiration_date
    target_type: Optional[date]
    description: When the current 10b5-1 plan expires
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: last_buyback_date
    target_type: Optional[datetime]
    description: Last recorded buyback execution
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: days_since_last_buyback
    target_type: int
    description: 'Convenience field: today - last_buyback_date'
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: in_blackout_period
    target_type: bool
    description: Cached convenience flag
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
  - target_field: anomalies
    target_type: list[AnomalyFlag]
    description: ''
    source: Polygon + SEC EDGAR + Finnhub
    source_endpoint: Multiple sources
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from Polygon reference data, SEC EDGAR filings, and Finnhub event calendars.'
- entity: RegulatoryFiling
  spec_id: Q12:12c
  description: Q12:12c — SEC filings classified by type and impact (13D, 8-K, HSR, S-3, proxy).
  is_primary_entity: true
  primary_source: SEC EDGAR RSS feeds (free)
  fallback_source: Finnhub
  cadence: Real-time (EDGAR RSS updates within seconds)
  feasibility: HIGH — EDGAR RSS feeds are near real-time
  fields:
  - target_field: recent_filings
    target_type: list[RegulatoryEvent]
    description: Recent regulatory filings (last 90 days). Each entry captures filing type, date, material event classification
