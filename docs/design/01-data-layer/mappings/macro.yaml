domain: macro
spec_prefix: Q6
module_description: 'Q6: Macro and Rates — entity definitions.'
common_fields_note: 'All primary entities include ''ticker: Ticker'' and ''metadata: InvocationMetadata'' fields (omitted
  from individual field listings). See _common.yaml for InvocationMetadata mapping.'
entities:
- entity: YieldLevelAndChange
  spec_id: N/A (supporting type)
  description: A single yield level with rate-of-change metrics at multiple horizons.
  is_primary_entity: false
  fields:
  - target_field: level
    target_type: float
    description: Current yield in basis points (e.g., 4.25%)
    source: FRED + BLS + Derived
    source_endpoint: GET /fred/series/observations?series_id={id}
    source_field: Computed
    source_type: N/A
    transform: 'Distillation: derived from FRED/BLS macro time series. See entity-level source info.'
  - target_field: change_1d
    target_type: float
    description: Daily change in basis points
    source: FRED + BLS + Derived
    source_endpoint: GET /fred/series/observations?series_id={id}
    source_field: Computed
    source_type: N/A
    transform: 'Distillation: derived from FRED/BLS macro time series. See entity-level source info.'
  - target_field: change_5d
    target_type: float
    description: 5-day change in basis points
    source: FRED + BLS + Derived
    source_endpoint: GET /fred/series/observations?series_id={id}
    source_field: Computed
    source_type: N/A
    transform: 'Distillation: derived from FRED/BLS macro time series. See entity-level source info.'
  - target_field: change_20d
    target_type: float
    description: 20-day (monthly) change in basis points
    source: FRED + BLS + Derived
    source_endpoint: GET /fred/series/observations?series_id={id}
    source_field: Computed
    source_type: N/A
    transform: 'Distillation: derived from FRED/BLS macro time series. See entity-level source info.'
  - target_field: z_score
    target_type: float
    description: How many std devs from 20-day baseline. Volatility signal.
    source: FRED + BLS + Derived
    source_endpoint: GET /fred/series/observations?series_id={id}
    source_field: Computed
    source_type: N/A
    transform: 'Distillation: derived from FRED/BLS macro time series. See entity-level source info.'
- entity: CurveSpread
  spec_id: N/A (supporting type)
  description: A single yield curve spread and its dynamics.
  is_primary_entity: false
  fields:
  - target_field: spread
    target_type: float
    description: Spread width in basis points
    source: FRED + BLS + Derived
    source_endpoint: GET /fred/series/observations?series_id={id}
    source_field: Computed
    source_type: N/A
    transform: 'Distillation: derived from FRED/BLS macro time series. See entity-level source info.'
  - target_field: change_1d
