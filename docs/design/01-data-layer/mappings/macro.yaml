    source: FRED + BLS + Derived
    source_endpoint: GET /fred/series/observations?series_id={id}
    source_field: Computed
    source_type: N/A
    transform: 'Distillation: derived from FRED/BLS macro time series. See entity-level source info.'
  - target_field: z_score
    target_type: float
    description: Std devs from trailing baseline. Steepening/flattening signal.
    source: FRED + BLS + Derived
    source_endpoint: GET /fred/series/observations?series_id={id}
    source_field: Computed
    source_type: N/A
