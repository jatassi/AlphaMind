  description: Q4:4e — Composite short squeeze scoring from SI + borrow + short volume.
  is_primary_entity: true
  primary_source: |-
    Derived from Q4:4a (ShortInterestSnapshot), Q4:4b (BorrowCost),
            Q4:4c (ShortVolumeDaily), plus Q1:1a (price) and Q2:2b (depth)
  fallback_source: Derived from 4a + 4c only (without borrow costs)
  cadence: ON-DEMAND (computed when requested, not scheduled)
  feasibility: HIGH — computation is straightforward with iBorrowDesk borrow
