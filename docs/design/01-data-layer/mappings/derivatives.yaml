    target_type: int
    description: Days until this expiration. 1–365.
    source: Polygon Options + Derived
    source_endpoint: GET /v3/snapshot/options/{underlying}
    source_field: Computed
    source_type: N/A
    transform: 'Distillation: derived from Polygon options chain snapshot. See entity-level source notes.'
  - target_field: iv_level
    target_type: float
