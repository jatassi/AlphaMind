domain: price_volume
spec_prefix: Q1
module_description: 'Q1: Price and Volume — entity definitions.'
common_fields_note: 'All primary entities include ''ticker: Ticker'' and ''metadata: InvocationMetadata'' fields (omitted
  from individual field listings). See _common.yaml for InvocationMetadata mapping.'
entities:
- entity: OHLCVBar
  spec_id: N/A (supporting type)
  description: A single OHLCV candle at a specific timeframe. The atomic unit of price data.
  is_primary_entity: false
  primary_source: Polygon Stocks Starter
  fallback_source: Alpaca (free IEX)
  cadence: Every invocation
  feasibility: HIGH
  fields:
  - target_field: open
    target_type: float
    description: ''
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to}
    source_field: results[].o
    source_type: number
    transform: Direct map. USD float.
  - target_field: high
    target_type: float
    description: ''
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to}
    source_field: results[].h
    source_type: number
    transform: Direct map. USD float.
  - target_field: low
    target_type: float
    description: ''
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to}
    source_field: results[].l
    source_type: number
    transform: Direct map. USD float.
  - target_field: close
    target_type: float
    description: ''
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to}
    source_field: results[].c
    source_type: number
    transform: Direct map. USD float.
  - target_field: volume
    target_type: int
    description: Share volume during this bar
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to}
    source_field: results[].v
    source_type: integer
    transform: Direct map. Share volume.
  - target_field: vwap
    target_type: float
    description: Volume-weighted average price for this bar. More representative
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to}
    source_field: results[].vw
    source_type: number
    transform: Direct map. Volume-weighted average price.
  - target_field: trade_count
    target_type: int
    description: Number of individual trades. Higher trade count at same volume
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to}
    source_field: results[].n
    source_type: integer
    transform: Direct map. Number of trades in bar.
  - target_field: period_start
    target_type: Optional[datetime]
    description: UTC start of bar period
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to}
    source_field: results[].t
    source_type: integer (ms epoch)
    transform: Convert Unix ms timestamp to UTC datetime. This is the bar open time.
  - target_field: period_end
    target_type: Optional[datetime]
    description: UTC end of bar period
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to}
    source_field: results[].t
    source_type: integer (ms epoch)
    transform: 'Compute: period_start + timespan duration. Polygon only provides bar start time; end = start + bar_width (e.g.
      +15min, +1hr, +4hr, +1day).'
- entity: ReferenceLevels
  spec_id: N/A (supporting type)
  description: Key reference price levels where institutional algos cluster orders,
  is_primary_entity: false
  primary_source: Polygon Stocks Starter
  fallback_source: Alpaca
  cadence: Every invocation
  feasibility: HIGH
  fields:
  - target_field: prior_day_high
    target_type: float
    description: Yesterday's high — breakout above is bullish
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/prev
    source_field: results[0].h
    source_type: number
    transform: Direct map from previous day aggregates.
  - target_field: prior_day_low
    target_type: float
    description: Yesterday's low — breakdown below is bearish
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/prev
    source_field: results[0].l
    source_type: number
    transform: Direct map from previous day aggregates.
  - target_field: prior_day_close
    target_type: float
    description: Official close — the anchor for overnight gap calculation
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/prev
    source_field: results[0].c
    source_type: number
    transform: Direct map from previous day aggregates.
  - target_field: prior_day_vwap
    target_type: float
    description: Yesterday's VWAP — institutional execution benchmark
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/prev
    source_field: results[0].vw
    source_type: number
    transform: Direct map from previous day aggregates.
  - target_field: weekly_open
    target_type: float
    description: Monday's open price — weekly trend anchor
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (timespan=week)
    source_field: results[0].o
    source_type: number
    transform: Current week's bar open. Use weekly aggs for the most recent week.
  - target_field: monthly_open
    target_type: float
    description: First trading day of month open — monthly trend anchor
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (timespan=day)
    source_field: results[0].o
    source_type: number
    transform: First trading day of month open. Query daily bars from month start, take first result's open.
  - target_field: prior_week_high
    target_type: float
    description: Last week's high
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (timespan=week)
    source_field: results[-2].h
    source_type: number
    transform: Previous week's bar high. Query weekly aggs, take second-to-last result.
  - target_field: prior_week_low
    target_type: float
    description: Last week's low
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (timespan=week)
    source_field: results[-2].l
    source_type: number
    transform: Previous week's bar low.
  - target_field: current_session_vwap
    target_type: float
    description: Running VWAP for the current session. Institutional
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (timespan=minute, current day)
    source_field: Computed
    source_type: N/A
    transform: 'Distillation: compute running VWAP from today''s 1-min bars. sum(vw * v) / sum(v) across all bars.'
  - target_field: current_session_high
    target_type: float
    description: ''
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (timespan=minute, current day)
    source_field: max(results[].h)
    source_type: number
    transform: 'Distillation: max of all intraday bar highs for today.'
  - target_field: current_session_low
    target_type: float
    description: ''
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (timespan=minute, current day)
    source_field: min(results[].l)
    source_type: number
    transform: 'Distillation: min of all intraday bar lows for today.'
- entity: SwingPoint
  spec_id: N/A (supporting type)
  description: A detected swing high or swing low — a local price extreme that defines
  is_primary_entity: false
  primary_source: Derived (distillation layer)
  fallback_source: N/A
  cadence: Every invocation
  feasibility: HIGH
  fields:
  - target_field: price
    target_type: float
    description: Price level of the swing point
    source: Derived
    source_endpoint: Distillation layer computation
    source_field: N/A
    source_type: N/A
    transform: 'Computed: local high/low detection algorithm applied to OHLCV bars from Polygon. Fractal pivot detection (N-bar
      high/low).'
  - target_field: timestamp
    target_type: datetime
    description: When the swing point occurred (UTC)
    source: Derived
    source_endpoint: Distillation layer computation
    source_field: Derived from bar timestamp
    source_type: N/A
    transform: Timestamp of the bar containing the swing point. Source bar's results[].t converted to UTC.
  - target_field: is_high
    target_type: bool
    description: True for swing high, False for swing low
    source: Derived
    source_endpoint: Distillation layer computation
    source_field: N/A
    source_type: N/A
    transform: 'Computed: True if this is a local maximum (swing high), False if local minimum (swing low).'
  - target_field: strength
    target_type: int
    description: How many bars on each side confirm this swing point.
    source: Derived
    source_endpoint: Distillation layer computation
    source_field: N/A
    source_type: N/A
    transform: 'Computed: count of confirming bars on each side of the pivot. More bars = stronger swing point.'
- entity: TimeframeTrend
  spec_id: N/A (supporting type)
  description: Trend state assessment at a single timeframe. Combines swing structure
  is_primary_entity: false
  primary_source: Derived (distillation layer)
  fallback_source: N/A
  cadence: Every invocation
  feasibility: HIGH
  fields:
  - target_field: timeframe
    target_type: Timeframe
    description: ''
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: Set by distillation layer based on which timeframe is being analyzed.
  - target_field: trend_state
    target_type: TrendState
    description: Classified trend direction
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: classify from swing point sequence — higher highs + higher lows = UPTREND, lower highs + lower lows
      = DOWNTREND, else RANGE_BOUND.'
  - target_field: swing_highs
    target_type: list[SwingPoint]
    description: Recent swing highs (most recent first). Typically 3–5 points retained. Sequence of higher highs confirms
      uptrend; lower highs confirms downtrend.
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: list of SwingPoint objects detected at this timeframe. Most recent first, 3-5 retained.'
  - target_field: swing_lows
    target_type: list[SwingPoint]
    description: Recent swing lows (most recent first). Same logic inverted.
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: list of SwingPoint objects for swing lows. Same retention policy.'
  - target_field: ma_alignment
    target_type: str
    description: 'Describes EMA stacking at this timeframe:'
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: compare price vs EMA(20) vs EMA(50) vs EMA(200). ''bullish_stack'' if price > 20 > 50 > 200, ''bearish_stack''
      if inverted, else ''mixed''.'
  - target_field: trend_duration_bars
    target_type: int
    description: How many bars the current trend state has persisted.
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: count bars since trend_state last changed.'
  - target_field: trend_confidence
    target_type: float
    description: 0.0–1.0. Higher when swing structure and MA alignment
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: 0.0-1.0 score combining swing structure agreement with MA alignment. Higher when both align.'
- entity: MultiTimeframePriceBar
  spec_id: Q1:1a
  description: Q1:1a — Multi-timeframe OHLCV bars with reference levels and trend state.
  is_primary_entity: true
  primary_source: Polygon Stocks Starter
  fallback_source: Alpaca (free), yfinance
  cadence: Every invocation
  feasibility: HIGH
  fields:
  - target_field: bar_15min
    target_type: OHLCVBar
    description: Most recent completed 15-min bar
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=15, timespan=minute)
    source_field: results[-1]
    source_type: object {o,h,l,c,v,vw,t,n}
    transform: 'Map last completed 15-min bar to OHLCVBar. Fields: o→open, h→high, l→low, c→close, v→volume, vw→vwap, n→trade_count,
      t→period_start.'
  - target_field: bar_1h
    target_type: OHLCVBar
    description: Most recent completed 1-hour bar
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=hour)
    source_field: results[-1]
    source_type: object {o,h,l,c,v,vw,t,n}
    transform: Map last completed 1-hour bar to OHLCVBar.
  - target_field: bar_4h
    target_type: OHLCVBar
    description: Most recent completed 4-hour bar
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=4, timespan=hour)
    source_field: results[-1]
    source_type: object {o,h,l,c,v,vw,t,n}
    transform: Map last completed 4-hour bar to OHLCVBar.
  - target_field: bar_daily
    target_type: OHLCVBar
    description: Current or most recent completed daily bar
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=day)
    source_field: results[-1]
    source_type: object {o,h,l,c,v,vw,t,n}
    transform: Map current/most recent daily bar to OHLCVBar.
  - target_field: bar_weekly
    target_type: OHLCVBar
    description: Current or most recent completed weekly bar
    source: Polygon
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=week)
    source_field: results[-1]
    source_type: object {o,h,l,c,v,vw,t,n}
    transform: Map current/most recent weekly bar to OHLCVBar.
  - target_field: last_trade_price
    target_type: float
    description: Real-time last trade price. May differ from bar close
    source: Polygon
    source_endpoint: GET /v2/snapshot/locale/us/markets/stocks/tickers/{ticker}
    source_field: ticker.lastTrade.p
    source_type: number
    transform: 'From snapshot endpoint. Fallback: use most recent 1-min bar close.'
  - target_field: last_trade_time
    target_type: Optional[datetime]
    description: Timestamp of last trade (UTC)
    source: Polygon
    source_endpoint: GET /v2/snapshot/locale/us/markets/stocks/tickers/{ticker}
    source_field: ticker.lastTrade.t
    source_type: integer (ns epoch)
    transform: Convert nanosecond Unix timestamp to UTC datetime.
  - target_field: reference_levels
    target_type: Optional[ReferenceLevels]
    description: ''
    source: Polygon
    source_endpoint: Multiple endpoints (prev, aggs)
    source_field: Composed
    source_type: N/A
    transform: Compose ReferenceLevels object from prev day + weekly + monthly aggs + running intraday computation.
  - target_field: trend_15min
    target_type: Optional[TimeframeTrend]
    description: ''
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: TimeframeTrend from 15-min OHLCV series.'
  - target_field: trend_1h
    target_type: Optional[TimeframeTrend]
    description: ''
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: TimeframeTrend from 1-hour OHLCV series.'
  - target_field: trend_4h
    target_type: Optional[TimeframeTrend]
    description: ''
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: TimeframeTrend from 4-hour OHLCV series.'
  - target_field: trend_daily
    target_type: Optional[TimeframeTrend]
    description: ''
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: TimeframeTrend from daily OHLCV series.'
  - target_field: trend_weekly
    target_type: Optional[TimeframeTrend]
    description: ''
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: TimeframeTrend from weekly OHLCV series.'
  - target_field: composite_trend_score
    target_type: float
    description: 'Multi-timeframe composite trend score. Range: -1.0 (all timeframes bearish, aligned) to +1.0 (all timeframes
      bullish, aligned). Near 0.0 means conflicting signals across timeframes.  Weighting: higher...'
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: weighted average of per-timeframe trend scores. Weights: weekly(0.30) > daily(0.25) > 4h(0.20) >
      1h(0.15) > 15min(0.10). Range -1.0 to +1.0.'
  - target_field: composite_trend_label
    target_type: str
    description: 'Human-readable composite label for LLM consumption: "strong_uptrend" | "uptrend" | "weak_uptrend" | "neutral"
      | "weak_downtrend" | "downtrend" | "strong_downtrend"'
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: map composite_trend_score to label. >0.6=''strong_uptrend'', >0.3=''uptrend'', >0.1=''weak_uptrend'',
      >-0.1=''neutral'', >-0.3=''weak_downtrend'', >-0.6=''downtrend'', else ''strong_downtrend''.'
  - target_field: anomalies
    target_type: list[AnomalyFlag]
    description: ''
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Computed: anomaly detection on price/volume patterns. E.g., volume > 3x 20-day avg, price > 2 ATR move, etc.'
- entity: VolumeProfile
  spec_id: Q1:1b
  description: Q1:1b — Volume-at-price distribution with value area, POC, and node detection.
  is_primary_entity: true
  primary_source: Derived from Polygon 1-min bars
  fallback_source: yfinance 1-min bars (60 days only)
  cadence: Every invocation
  feasibility: MEDIUM — 1-min bar approximation acceptable for swing trades
  fields:
  - target_field: value_area_high
    target_type: float
    description: Upper bound of the price range where ~70% of volume
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=minute)
    source_field: Computed from 1-min OHLCV distribution
    source_type: N/A
    transform: 'Distillation: build price-volume histogram from 1-min bars (price=vw, vol=v). Find 70% volume range centered
      on POC. VAH = upper bound.'
  - target_field: value_area_low
    target_type: float
    description: Lower bound. Price below VAL = breakdown territory.
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=minute)
    source_field: Computed from 1-min OHLCV distribution
    source_type: N/A
    transform: 'Distillation: lower bound of 70% volume range.'
  - target_field: value_area_volume_pct
    target_type: float
    description: Actual percentage of volume within the VA (target ~70%).
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=minute)
    source_field: Computed from 1-min OHLCV distribution
    source_type: N/A
    transform: 'Distillation: actual volume within VA / total volume * 100.'
  - target_field: poc_price
    target_type: float
    description: The single most-traded price level. Acts as a magnet —
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=minute)
    source_field: Computed from 1-min OHLCV distribution
    source_type: N/A
    transform: 'Distillation: price level (vw) with highest cumulative volume (v). Bin prices into tick-sized buckets, sum
      volumes per bucket.'
  - target_field: poc_volume
    target_type: int
    description: Volume at the POC price level (shares)
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=minute)
    source_field: Computed from 1-min OHLCV distribution
    source_type: N/A
    transform: 'Distillation: total volume at POC price bucket.'
  - target_field: high_volume_nodes
    target_type: list[float]
    description: Price levels with concentrated volume (above 1 std dev from mean volume per level). These are "speed bumps"
      — price tends to stall and consolidate at these levels. Sorted by volume descending.
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=minute)
    source_field: Computed from 1-min OHLCV distribution
    source_type: N/A
    transform: 'Distillation: price buckets with volume > mean + 1 std dev. Return as sorted list of price levels.'
  - target_field: low_volume_nodes
    target_type: list[float]
    description: 'Price levels with minimal volume (below 0.5 std dev from mean). These are "air pockets" — price tends to
      move quickly through them. Important for the analyst: if price breaks through a high-volum...'
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=minute)
    source_field: Computed from 1-min OHLCV distribution
    source_type: N/A
    transform: 'Distillation: price buckets with volume < mean - 0.5 std dev. Return as sorted list.'
  - target_field: profile_type
    target_type: str
    description: '"single_distribution" — normal bell-shaped, mean-reversion'
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=minute)
    source_field: Computed from 1-min OHLCV distribution
    source_type: N/A
    transform: 'Distillation: classify distribution shape. Single peak = ''single_distribution'', two peaks = ''double_distribution'',
      volume at lows = ''b_shaped'', at highs = ''p_shaped''.'
  - target_field: profile_developing
    target_type: bool
    description: True if the current session's volume profile is still
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=minute)
    source_field: Computed from 1-min OHLCV distribution
    source_type: N/A
    transform: Set True if profile covers current (incomplete) session.
  - target_field: profile_migration
    target_type: str
    description: '"higher" | "lower" | "stable" | "expanding"'
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=minute)
    source_field: Computed from 1-min OHLCV distribution
    source_type: N/A
    transform: 'Distillation: compare current session VAH/VAL vs prior session. Higher = ''higher'', lower = ''lower'', overlapping
      = ''stable'', wider = ''expanding''.'
  - target_field: profile_period
    target_type: str
    description: '"session" | "2_day" | "5_day" | "weekly"'
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=minute)
    source_field: Computed from 1-min OHLCV distribution
    source_type: N/A
    transform: 'Set based on bars queried: today = ''session'', 2 days = ''2_day'', etc.'
  - target_field: total_profile_volume
    target_type: int
    description: Total shares across all price levels in the profile
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (multiplier=1, timespan=minute)
    source_field: Computed from 1-min OHLCV distribution
    source_type: N/A
    transform: Sum of all v values across all 1-min bars in the profile period.
  - target_field: anomalies
    target_type: list[AnomalyFlag]
    description: ''
    source: Derived
