    source_type: N/A
    transform: 'Computed: Bollinger(20,2). upper_band=SMA+2σ, lower_band=SMA-2σ, middle_band=SMA(20), histogram=bandwidth.
      Per timeframe.'
  - target_field: keltner
    target_type: list[IndicatorReading]
    description: Keltner Channels(20, 1.5×ATR). When Bollinger bands contract inside Keltner channels, it's a "squeeze" —
      the TTM Squeeze setup that signals an imminent volatility expansion. Stored for squeeze detecti...
