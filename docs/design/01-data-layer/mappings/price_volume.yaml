- entity: HistoricalContext
  spec_id: Q1:1f
  description: 'Q1:1f — Historical regime context: ATR-normalized moves, 52-week positioning.'
  is_primary_entity: true
  primary_source: Derived from Polygon OHLCV + rolling statistics
  fallback_source: N/A
  cadence: Every invocation
  feasibility: HIGH — derived from OHLCV
  fields:
  - target_field: daily_range_atr
    target_type: float
    description: Today's high-low range as a multiple of ATR(14).
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: (today_high - today_low) / ATR(14). From Polygon daily bars.'
  - target_field: daily_move_atr
    target_type: float
    description: Today's directional move (close vs. prior close) in ATR
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: (today_close - yesterday_close) / ATR(14). Signed.'
  - target_field: move_5d_atr
    target_type: float
    description: 5-day cumulative directional move in ATR multiples
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: (close_today - close_5d_ago) / ATR(14).'
  - target_field: move_20d_atr
    target_type: float
    description: 20-day cumulative directional move in ATR multiples
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: (close_today - close_20d_ago) / ATR(14).'
  - target_field: pct_of_52w_range
    target_type: float
    description: Where current price sits in the 52-week range.
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: (current_price - low_52w) / (high_52w - low_52w) * 100. From trailing 252 trading days of Polygon
      daily bars.'
  - target_field: high_52w
    target_type: float
    description: 52-week high price
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: max(h) over trailing 252 daily bars.'
  - target_field: low_52w
    target_type: float
    description: 52-week low price
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: min(l) over trailing 252 daily bars.'
  - target_field: days_since_52w_high
    target_type: int
    description: Calendar days since the 52-week high was set
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: calendar days from date of 52w high to today.'
  - target_field: days_since_52w_low
    target_type: int
    description: Calendar days since the 52-week low was set
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: calendar days from date of 52w low to today.'
  - target_field: near_52w_high
    target_type: bool
    description: Within 3% of 52-week high (potential breakout)
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: True if current_price >= high_52w * 0.97.'
  - target_field: near_52w_low
    target_type: bool
    description: Within 3% of 52-week low (potential capitulation)
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: True if current_price <= low_52w * 1.03.'
  - target_field: dist_ema_20_atr
    target_type: float
    description: (Price - EMA20) / ATR. Positive = above, negative = below.
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: (current_price - EMA(20)) / ATR(14).'
  - target_field: dist_ema_50_atr
    target_type: float
    description: Same for 50 EMA. Mean-reversion signal at ±3 ATR.
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: (current_price - EMA(50)) / ATR(14).'
  - target_field: dist_ema_200_atr
    target_type: float
    description: Same for 200 EMA. Extreme distance from 200 EMA is the
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: (current_price - EMA(200)) / ATR(14).'
  - target_field: vol_regime
    target_type: str
    description: '"compression" | "expansion" | "stable"'
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: if ATR declining and BB narrowing → ''compression''; if ATR rising → ''expansion''; else ''stable''.'
  - target_field: bollinger_squeeze
    target_type: bool
    description: True when Bollinger bands are at historically narrow width
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: True if BB bandwidth < 20th percentile of trailing 252-day bandwidth.'
  - target_field: atr_percentile_1y
    target_type: float
    description: Where current ATR sits vs. its own trailing 1-year range.
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: percentile rank of current ATR vs trailing 252 ATR values.'
  - target_field: anomalies
    target_type: list[AnomalyFlag]
    description: ''
    source: Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (daily, 1yr lookback)
    source_field: N/A
    source_type: N/A
    transform: 'Computed: flag extreme readings (pct_of_52w_range > 95 or < 5, daily_move_atr > 3).'
- entity: ExtendedHoursBar
  spec_id: Q1:1g
  description: Q1:1g — Pre-market and after-hours OHLCV with volume context.
  is_primary_entity: true
  primary_source: Polygon Stocks Starter
  fallback_source: Alpaca
  cadence: Every invocation
  feasibility: HIGH — Polygon Stocks Starter provides ext-hours bars
  fields:
  - target_field: pre_market_bar
    target_type: Optional[OHLCVBar]
    description: Aggregated pre-market candle. None if no
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Polygon: query 1-min bars for today. Filter bars with timestamp 04:00-09:30 ET. Aggregate into single OHLCVBar
      (o=first.o, h=max(h), l=min(l), c=last.c, v=sum(v), vw=sum(vw*v)/sum(v), n=sum(n)).'
  - target_field: pre_market_change_pct
    target_type: float
    description: '% change from prior regular close to pre-market last trade'
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: (pre_market_bar.c - prior_regular_close) / prior_regular_close * 100.'
  - target_field: pre_market_change_atr
    target_type: float
    description: Same, in ATR multiples
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: abs(pre_market_change) / ATR(14).'
  - target_field: after_hours_bar
    target_type: Optional[OHLCVBar]
    description: Aggregated after-hours candle.
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Polygon: filter 1-min bars with timestamp 16:00-20:00 ET. Aggregate same as pre-market.'
  - target_field: after_hours_change_pct
    target_type: float
    description: '% change from regular close to after-hours last trade'
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: (after_hours_bar.c - regular_close) / regular_close * 100.'
  - target_field: after_hours_change_atr
    target_type: float
    description: ''
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: abs(after_hours_change) / ATR(14).'
  - target_field: pre_market_volume_vs_avg
    target_type: float
    description: Pre-market volume as a ratio of the average pre-market volume for this ticker (20-day trailing). > 2.0 =
      unusually active pre-market, suggesting a catalyst or institutional positioning. < 0.5 = quiet,...
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: today_pre_market_volume / avg_pre_market_volume_20d. Requires maintaining 20-day trailing pre-market
      volumes.'
  - target_field: after_hours_volume_vs_avg
    target_type: float
    description: Same ratio for after-hours session.
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: today_after_hours_volume / avg_after_hours_volume_20d.'
  - target_field: extended_hours_volume_vs_regular_session
    target_type: float
    description: 'Total extended-hours volume as a percentage of the most recent regular session volume. Normal range: 2–10%.
      Above 15% is exceptional and usually means an earnings release or major news event occurred.'
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: (pre_market_vol + after_hours_vol) / regular_session_vol * 100.'
  - target_field: gap_from_close
    target_type: float
    description: Dollar gap from regular session close to most recent
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: last_extended_hours_trade_price - regular_session_close.'
  - target_field: gap_from_close_pct
    target_type: float
    description: Same, as percentage
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: gap_from_close / regular_close * 100.'
  - target_field: gap_from_close_atr
    target_type: float
    description: Same, in ATR multiples
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: abs(gap_from_close) / ATR(14).'
  - target_field: confidence_discount
    target_type: float
    description: 0.0–1.0 multiplier on signal reliability. 1.0 = full
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: f(volume_ratio, spread_ratio). Higher ext-hours volume + tighter spreads = higher confidence.'
  - target_field: ext_hours_spread_ratio
    target_type: float
    description: Average ext-hours spread / average regular-hours spread.
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Polygon: would require quote data (NOT_AUTHORIZED on Starter). Fallback: estimate from 1-min bar range vs
      regular-hours range.'
  - target_field: historical_confirmation_rate
    target_type: float
    description: 'Over the trailing 60 days, what percentage of extended-hours moves in this name were confirmed (continued
      in the same direction) during the first 30 minutes of the next regular session. Range: 0.0–1.0...'
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: backtest 60 days. For each day, compare ext-hours move direction with first 30 min of next regular
      session. Confirmation rate = same_direction / total_days.'
  - target_field: anomalies
    target_type: list[AnomalyFlag]
    description: ''
    source: Polygon + Derived
    source_endpoint: GET /v2/aggs/ticker/{ticker}/range/{multiplier}/{timespan}/{from}/{to} (1-min, include extended hours)
    source_field: Computed
    source_type: varies
    transform: 'Computed: flag if pre_market_volume_vs_avg > 3.0 or gap_from_close_atr > 1.5.'
audit_notes: 'AUDIT 2026-03-15: Polygon Starter tier limitations documented — /v2/last/trade and /v2/last/nbbo return NOT_AUTHORIZED.
  Workaround: use /v2/snapshot endpoint (confirmed working with full data including lastQuote, min, prevDay). Extended hours
  confirmed: 1-min bars available from 4:00 AM ET (pre-market) through midnight ET (after-hours). Alpaca backup confirmed
  working: bars, trades, quotes, snapshots all verified.'
