- entity: BreakingHeadline
  spec_id: Qual1:1a
  description: Qual 1:1a — Wire service and financial news headlines with sentiment tagging.
  is_primary_entity: true
  primary_source: Marketaux + Finnhub
  fallback_source: Benzinga ($50-200/mo for wire-speed)
  cadence: Continuous (as headlines are published)
  feasibility: MEDIUM — multi-source pipeline, slower than wire services but broad coverage
  fields:
  - target_field: headline_text
    target_type: str
    description: 'The full headline text. E.g., "Apple Misses Q3 Revenue Estimates by 5%". Minimal processing: formatting
      cleaned, source-specific metadata stripped. This is the raw input to the sentiment analysis pipe...'
    source: SEC EDGAR
    source_endpoint: GET /api/xbrl/companyfacts/CIK{cik}.json
    source_field: See transform
    source_type: varies
    transform: |-
      Distillation: derived from Finnhub News (free) + Marketaux (free, 100 req/day with pre-computed sentiment)
              + RSS feeds (CNBC/Reuters/MarketWatch) + SEC EDGAR 8-K RSS. See entity docstring for computation logic.
  - target_field: source
    target_type: str
    description: Source outlet name (e.g., "Reuters", "CNBC", "Seeking Alpha"). Used for attribution and audit trail. Important
      for understanding which outlets typically break news vs. react to competitors' scoops.
    source: SEC EDGAR
    source_endpoint: GET /api/xbrl/companyfacts/CIK{cik}.json
    source_field: See transform
    source_type: varies
    transform: |-
