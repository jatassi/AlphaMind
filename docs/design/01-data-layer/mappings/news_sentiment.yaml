domain: news_sentiment
spec_prefix: Qual1
module_description: 'Qual 1–2: News, Financial Media, and Sentiment — entity definitions.'
common_fields_note: 'All primary entities include ''ticker: Ticker'' and ''metadata: InvocationMetadata'' fields (omitted
  from individual field listings). See _common.yaml for InvocationMetadata mapping.'
entities:
- entity: HeadlineCluster
  spec_id: Qual1:1a-derived
  description: A group of related headlines produced by the news pipeline's two-pass
    clustering algorithm (Stage 1 syndication collapse, Stage 2 same-event grouping).
  is_primary_entity: true
  primary_source: Derived from BreakingHeadline ingestion (Finnhub + Marketaux + RSS + 8-K)
  fallback_source: N/A (deterministic local computation; no external dependency)
  cadence: Continuous (clusters update as new headlines arrive within the 24h window)
  feasibility: HIGH — fully deterministic, no model artifact or external dependency
  fields:
  - target_field: cluster_id
    target_type: str
    description: The article_id of the earliest source-canonical member; persists in
      news_article_clusters and is materialized onto news_articles.cluster_id and
      BreakingHeadline.cross_ticker_cluster_id.
    source: Derived
    source_endpoint: news pipeline § Headline clustering (Stage 1 + Stage 2)
    source_field: BreakingHeadline.article_id of the earliest source-canonical member
    source_type: string
    transform: See entity docstring for computation logic.
  - target_field: primary_theme
    target_type: HeadlineType
    description: Modal HeadlineType across cluster members; ties resolve to the modal
      member's first topic_tags entry.
    source: Derived
    source_endpoint: news pipeline § Headline clustering (Stage 2)
    source_field: BreakingHeadline.topic_tags across cluster members
    source_type: enum
    transform: See entity docstring for computation logic.
  - target_field: headline_count
    target_type: int
    description: Number of source-canonical headlines (post-syndication, distinct outlets only).
      The count Step 2 of the news-digest ranking algorithm scores on.
    source: Derived
    source_endpoint: news pipeline § Headline clustering (Stage 1 + Stage 2)
    source_field: count of source-canonical members in the cluster
    source_type: integer
    transform: See entity docstring for computation logic.
  - target_field: first_seen_at
    target_type: datetime
    description: UTC timestamp of the earliest source-canonical member's publication.
      Anchors the 24h sealing window.
    source: Derived
    source_endpoint: news pipeline § Headline clustering (Stage 1)
    source_field: min(BreakingHeadline.published_at) across cluster members
    source_type: datetime
    transform: See entity docstring for computation logic.
  - target_field: last_seen_at
    target_type: datetime
    description: UTC timestamp of the most recent member's publication. Used by the
      news digest to gauge cluster activity.
    source: Derived
    source_endpoint: news pipeline § Headline clustering (Stage 2)
    source_field: max(BreakingHeadline.published_at) across cluster members
    source_type: datetime
    transform: See entity docstring for computation logic.
  - target_field: tickers_involved
    target_type: list[Ticker]
    description: Union of (primary_ticker, tickers_mentioned) across cluster members.
    source: Derived
    source_endpoint: news pipeline § Headline clustering (Stage 2)
    source_field: BreakingHeadline.(primary_ticker, tickers_mentioned) across cluster members
    source_type: list[string]
    transform: See entity docstring for computation logic.
- entity: NewsVolume
  spec_id: N/A (supporting type)
  description: Point-in-time news volume for a ticker across multiple rolling windows.
  is_primary_entity: false
  fields:
  - target_field: volume_2hr
    target_type: int
    description: Article count in last 2 hours
    source: Marketaux
    source_endpoint: GET /v1/news/all?symbols={ticker}&filter_entities=true
    source_field: 'Derived: count of articles per time window'
    source_type: integer
    transform: 'Marketaux: data[].title, data[].description, data[].entities[].sentiment_score. Finnhub company-news for additional
      coverage.'
  - target_field: volume_6hr
    target_type: int
    description: Article count in last 6 hours
    source: Marketaux
    source_endpoint: GET /v1/news/all?symbols={ticker}&filter_entities=true
    source_field: 'Derived: count of articles per time window'
    source_type: integer
    transform: 'Marketaux: data[].title, data[].description, data[].entities[].sentiment_score. Finnhub company-news for additional
      coverage.'
  - target_field: volume_24hr
    target_type: int
    description: Article count in last 24 hours
    source: Marketaux
    source_endpoint: GET /v1/news/all?symbols={ticker}&filter_entities=true
    source_field: 'Derived: count of articles per time window'
    source_type: integer
    transform: 'Marketaux: data[].title, data[].description, data[].entities[].sentiment_score. Finnhub company-news for additional
      coverage.'
  - target_field: volume_vs_avg_20d
    target_type: float
    description: Ratio of current 24hr volume to 20-day trailing average
    source: Marketaux
    source_endpoint: GET /v1/news/all?symbols={ticker}&filter_entities=true
    source_field: 'Derived: count of articles per time window'
    source_type: integer
    transform: 'Marketaux: data[].title, data[].description, data[].entities[].sentiment_score. Finnhub company-news for additional
      coverage.'
