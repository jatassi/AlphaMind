domain: _common
spec_prefix: ''
module_description: Common types, enums, and base definitions shared across all schema modules.
common_fields_note: 'All primary entities include ''ticker: Ticker'' and ''metadata: InvocationMetadata'' fields (omitted
  from individual field listings). See _common.yaml for InvocationMetadata mapping.'
entities:
- entity: AnomalyFlag
  spec_id: N/A (supporting type)
  description: A detected statistical anomaly. The distillation layer produces these as part of every entity.
  is_primary_entity: false
  primary_source: Derived (distillation layer)
  fallback_source: N/A
  cadence: Every invocation
  feasibility: HIGH — 100% computed
  fields:
  - target_field: anomaly_type
    target_type: str
    description: Machine-readable anomaly category (e.g., "volume_spike", "correlation_breakdown")
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Distillation: set by anomaly detection logic. String enum assigned based on which statistical test triggered
      (z-score threshold, distribution shift, etc.).'
  - target_field: description
    target_type: str
    description: Human-readable description for LLM consumption
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Distillation: generated string describing the anomaly in plain English. E.g., ''AAPL volume 4.2x 20-day average
      on no news catalyst''.'
  - target_field: z_score
    target_type: float
    description: Standard deviations from 20-day trailing baseline
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Distillation: (current_value - trailing_20d_mean) / trailing_20d_std. Computed on the metric that triggered
      the anomaly.'
  - target_field: direction
    target_type: Direction
    description: Which way the anomaly goes
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Distillation: BULLISH if anomaly suggests upward pressure, BEARISH if downward, NEUTRAL if ambiguous.'
  - target_field: severity
    target_type: SignalStrength
    description: How actionable this anomaly is
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Distillation: map z_score to severity. |z| > 3.0 = STRONG, |z| > 2.0 = MODERATE, |z| > 1.5 = WEAK.'
  - target_field: related_tickers
    target_type: list[Ticker]
    description: Tickers involved
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Distillation: list of tickers affected by this anomaly. For single-ticker anomalies, just the one ticker.
      For cross-asset anomalies (correlation breakdown), multiple tickers.'
  - target_field: related_spec_ids
    target_type: list[str]
    description: Which data categories flagged this
    source: Derived
    source_endpoint: Distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Distillation: list of spec IDs (e.g., [''Q1:1a'', ''Q2:2a'']) whose data contributed to detecting this anomaly.'
- entity: InvocationMetadata
  spec_id: N/A (supporting type)
  description: Metadata attached to every entity instance, identifying when and how the data was collected.
  is_primary_entity: false
  primary_source: System-generated
  fallback_source: N/A
  cadence: Every invocation
  feasibility: HIGH — system infrastructure
  fields:
  - target_field: invocation_id
    target_type: str
    description: Unique pipeline run identifier (UUID)
    source: System
    source_endpoint: Generated by orchestrator
    source_field: N/A
    source_type: N/A
    transform: 'System: UUID4 generated at pipeline invocation start. Shared across all entities produced in the same run.'
  - target_field: invocation_type
    target_type: str
    description: '"pre_open" | "intraday" | "pre_close" | "off_hours"'
    source: System
    source_endpoint: Generated by orchestrator
    source_field: N/A
    source_type: N/A
    transform: 'System: set by scheduler based on current time. pre_open=4:00-9:30 ET, intraday=9:30-15:45 ET, pre_close=15:45-16:00
      ET, off_hours=16:00-4:00 ET.'
  - target_field: collected_at
    target_type: datetime
    description: UTC timestamp when data was collected/computed
    source: System
    source_endpoint: Generated by orchestrator
    source_field: N/A
    source_type: N/A
    transform: 'System: datetime.utcnow() at the moment this entity''s data collection/computation completes.'
  - target_field: data_confidence
    target_type: DataConfidence
    description: Overall reliability of this data point
    source: System + Derived
    source_endpoint: Assessed by distillation layer
    source_field: N/A
    source_type: N/A
    transform: 'Distillation: assessed based on source freshness, data completeness, and market session. HIGH during regular
      hours with fresh data, MEDIUM for extended hours or slightly stale, LOW for estimated/interpolated.'
  - target_field: vol_regime
    target_type: VolatilityRegime
    description: Current volatility regime (universal context)
    source: Derived
    source_endpoint: From VolRegimeClassification entity (Q11:11f)
    source_field: N/A
    source_type: N/A
    transform: 'Cross-reference: pull current regime from the latest VolRegimeClassification entity. Attached to every entity
      so downstream consumers always have vol context.'
audit_notes: 'AUDIT 2026-03-15: All enum types and shared types verified against actual API response values. InvocationMetadata
  vol_regime sourced from VIX (FRED VIXCLS) + realized vol computation.'
