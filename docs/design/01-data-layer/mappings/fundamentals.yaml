domain: fundamentals
spec_prefix: Q5
module_description: 'Q5: Fundamental and Earnings — entity definitions.'
common_fields_note: 'All primary entities include ''ticker: Ticker'' and ''metadata: InvocationMetadata'' fields (omitted
  from individual field listings). See _common.yaml for InvocationMetadata mapping.'
entities:
- entity: EstimateRevision
  spec_id: N/A (supporting type)
  description: A single estimate revision event tracked to the hour for intraday timing.
  is_primary_entity: false
  primary_source: yfinance (Yahoo Finance)
  fallback_source: Finnhub (basic, free tier limited)
  cadence: Daily cache refresh
  feasibility: HIGH
  fields:
  - target_field: revision_timestamp
    target_type: datetime
    description: UTC timestamp when the revision was published
    source: yfinance
    source_endpoint: yfinance.Ticker(ticker).get_earnings_estimate() / get_eps_revisions() / get_revenue_estimate()
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from yfinance earnings/revenue estimate data.'
  - target_field: field
    target_type: str
    description: '"eps_current_quarter", "eps_next_quarter", "eps_fy", "revenue_cq", etc.'
    source: yfinance
    source_endpoint: yfinance.Ticker(ticker).get_earnings_estimate() / get_eps_revisions() / get_revenue_estimate()
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from yfinance earnings/revenue estimate data.'
  - target_field: prior_estimate
    target_type: float
    description: Previous consensus before this revision
    source: yfinance
    source_endpoint: yfinance.Ticker(ticker).get_earnings_estimate() / get_eps_revisions() / get_revenue_estimate()
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from yfinance earnings/revenue estimate data.'
  - target_field: new_estimate
    target_type: float
    description: New consensus after this revision
    source: yfinance
    source_endpoint: yfinance.Ticker(ticker).get_earnings_estimate() / get_eps_revisions() / get_revenue_estimate()
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from yfinance earnings/revenue estimate data.'
  - target_field: revision_magnitude
    target_type: float
    description: Absolute change in estimate
    source: yfinance
    source_endpoint: yfinance.Ticker(ticker).get_earnings_estimate() / get_eps_revisions() / get_revenue_estimate()
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from yfinance earnings/revenue estimate data.'
  - target_field: revision_pct
    target_type: float
    description: Percentage change in estimate
    source: yfinance
    source_endpoint: yfinance.Ticker(ticker).get_earnings_estimate() / get_eps_revisions() / get_revenue_estimate()
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from yfinance earnings/revenue estimate data.'
  - target_field: revising_analyst_count
    target_type: int
    description: How many analysts revised in this cluster
    source: yfinance
    source_endpoint: yfinance.Ticker(ticker).get_earnings_estimate() / get_eps_revisions() / get_revenue_estimate()
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from yfinance earnings/revenue estimate data.'
  - target_field: revision_direction
    target_type: Direction
    description: UP / DOWN / NEUTRAL
    source: yfinance
    source_endpoint: yfinance.Ticker(ticker).get_earnings_estimate() / get_eps_revisions() / get_revenue_estimate()
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from yfinance earnings/revenue estimate data.'
