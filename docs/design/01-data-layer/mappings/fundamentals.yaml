- entity: ValuationMultiples
  spec_id: Q5:VAL
  description: Q5:VAL — Valuation ratios with peer-relative context for sector analysis.
  is_primary_entity: true
  primary_source: yfinance info + Finnhub basic_financials
  fallback_source: Polygon financials
  cadence: Daily
  feasibility: HIGH
  fields:
  - target_field: pe_trailing
    target_type: Optional[float]
    description: P/E ratio based on trailing 12-month earnings
    source: yfinance + Finnhub
    source_endpoint: See yfinance info + Finnhub basic_financials documentation — derived from entity primary source
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from yfinance info dict and Finnhub basic financials metric.'
  - target_field: pe_forward
    target_type: Optional[float]
    description: P/E based on forward 12-month consensus estimates
    source: yfinance + Finnhub
    source_endpoint: See yfinance info + Finnhub basic_financials documentation — derived from entity primary source
    source_field: Computed
    source_type: varies
    transform: 'Distillation: derived from yfinance info dict and Finnhub basic financials metric.'
  - target_field: ps_ratio
    target_type: Optional[float]
    description: Price-to-Sales (market cap / ttm revenue)
    source: yfinance + Finnhub
    source_endpoint: yfinance .info + Finnhub /stock/metric?metric=all
    source_field: Computed
    source_type: varies
    transform: 'yfinance: info[''priceToSalesTrailing12Months''].'
  - target_field: pb_ratio
    target_type: Optional[float]
    description: Price-to-Book (market cap / book value)
    source: yfinance + Finnhub
    source_endpoint: yfinance .info + Finnhub /stock/metric?metric=all
    source_field: Computed
    source_type: varies
    transform: 'yfinance: info[''priceToBook'']. Finnhub: metric.pbAnnual.'
  - target_field: ev_ebitda
    target_type: Optional[float]
    description: EV / EBITDA
