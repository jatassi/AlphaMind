domain: prediction_markets
spec_prefix: Qual3
module_description: 'Qual 3: Prediction Markets — entity definitions.'
common_fields_note: 'All primary entities include ''ticker: Ticker'' and ''metadata: InvocationMetadata'' fields (omitted
  from individual field listings). See _common.yaml for InvocationMetadata mapping.'
entities:
- entity: RateProbabilityPair
  spec_id: N/A (supporting type)
  description: A rate level and its probability from a terminal rate distribution.
  is_primary_entity: false
  fields:
  - target_field: rate_bps
    target_type: int
    description: Basis points (e.g., 450 = 4.50%)
    source: Kalshi + Polymarket
    source_endpoint: 'Kalshi: GET /trade-api/v2/markets?series_ticker=KXFEDCOMBO (public, no auth). Polymarket: GET https://gamma-api.polymarket.com/markets?closed=false
      (public, no auth)'
    source_field: See transform
    source_type: varies
    transform: 'Kalshi: markets[].yes_bid, markets[].yes_ask, markets[].last_price (probability as price 0-1). Polymarket:
      market.outcomePrices (JSON array of Yes/No prices), market.volume, market.liquidity. Combine: average probabilities
      weighted by market liquidity.'
  - target_field: probability
    target_type: float
    description: Probability mass at this level (0.0–1.0)
    source: Kalshi + Polymarket
    source_endpoint: 'Kalshi: GET /trade-api/v2/markets?series_ticker=KXFEDCOMBO (public, no auth). Polymarket: GET https://gamma-api.polymarket.com/markets?closed=false
      (public, no auth)'
    source_field: See transform
    source_type: varies
    transform: 'Kalshi: markets[].yes_bid, markets[].yes_ask, markets[].last_price (probability as price 0-1). Polymarket:
      market.outcomePrices (JSON array of Yes/No prices), market.volume, market.liquidity. Combine: average probabilities
      weighted by market liquidity.'
