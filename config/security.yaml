# Security configuration — load via SecurityConfig.
# See src/alphamind/command_center/config.py for the model + per-field docs.
session:
  duration_hours: 12
  cookie_name: "cc_session"
csrf:
  cookie_name: "cc_csrf"
webauthn:
  relying_party_id: "localhost"  # Must match command-center.yaml access.host (or
                                 # "localhost" for pure loopback v1). Changing the
                                 # rpId requires passkey re-enrollment (old creds
                                 # bound to prior rpId). For LAN: set to your
                                 # chosen hostname (e.g. "alphamind.local").
                                 # See RUNBOOK_command_center.md § "LAN access
                                 # (local network)" and the access: block docs.
  relying_party_name: "AlphaMind Command Center"
# cookies_secure: false       # DEPLOY_TIME (ALP-725). False for http LAN/localhost;
#                             # true when origin is https (LAN https or future remote).
#                             # See config.py SecurityConfig + AccessConfig.
