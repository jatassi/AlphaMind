# Command center backend configuration — load via CommandCenterConfig.
# See src/alphamind/command_center/config.py for the model + per-field docs.
bind:
  host: "127.0.0.1"           # loopback for v1 zero-config installs. For LAN access
                              # from other machines, widen this (0.0.0.0 or the
                              # trading machine's LAN IP) together with the
                              # `access:` block below. See docs/runbooks/command-center.md
                              # § "LAN access (local network)" for the supported
                              # recipe (hostname choice, exact YAML, re-enroll,
                              # firewall). The old direct "switch to LAN IP" path
                              # is superseded by the access: decoupling (ALP-725).
  port: 8090                  # Moved off 8080: the SlipStream app holds IPv6 [::1]:8080,
                              # which wins the `localhost` lookup over the command
                              # center's IPv4 127.0.0.1 bind, so the browser was
                              # reaching SlipStream's passkey page instead. 8090 is free
                              # on both stacks, so `http://localhost:8090` connection-
                              # refuses on ::1 and falls through to this IPv4 listener.
                              # rpId stays "localhost" (host unchanged) — no passkey
                              # re-enrollment required.

# Public browser-visible origin (ALP-725). Pinned to the moved port so the WebAuthn
# expected_origin + cookie flags match what the operator types. host stays "localhost"
# to match security.yaml webauthn.relying_party_id (loopback v1; no re-enrollment).
access:
  scheme: "http"
  host: "localhost"
  port: 8090

db:
  alphamind_db_path: "%USERPROFILE%/AlphaMind/data/alphamind.db"
frontend:
  dist_path: "src/alphamind/command_center/frontend/dist"
# Loopback URLs the command center forwards to. The /api/control proxy
# (story ALP-668) uses control_url; the /events SSE multiplexer (story
# ALP-669) uses events_url. Both default to the upstream services'
# control_port values pinned in scheduler.yaml (8765) and
# continuous_monitor.yaml (8766).
pipeline:
  control_url: "http://127.0.0.1:8765"
  events_url: "http://127.0.0.1:8765"
monitor:
  control_url: "http://127.0.0.1:8766"
  events_url: "http://127.0.0.1:8766"
