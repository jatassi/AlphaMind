# APScheduler cron triggers — fires the analysis pipeline on the schedule
# defined per design/configuration-management.md § scheduler.yaml. Trigger
# keys are stems for run_types/<key>.yaml overlays. The bottom block holds
# pipeline-scheduler runtime knobs added in ALP-442 story 01 (parent
# decision (D)): they are loaded directly at process start by the scheduler
# package, not by the resolver cascade.

timezone: US/Eastern
max_instances: 1
overlap_dedup_lookback_minutes: 30

# Scheduler-runtime knobs (ALP-442 story 01).
emergency_poll_interval_seconds: 5
market_calendar_exchange: "XNYS"
supervisor_shutdown_timeout_seconds: 10

# Loopback-bound /control + /events HTTP surface (ALP-664).
# Browser traffic reaches the command-center backend's /api/control proxy,
# which then forwards to 127.0.0.1:control_port. Operators may change the
# port if it conflicts with another service on the trading machine.
control_port: 8765

# Tier B cadence (ALP-745). Every trigger fires in a distinct minute. The
# `as_of` is second-resolution and cron fires land on `:00`, so a distinct
# minute means a distinct `as_of` — no two scheduled runs ever share one, and
# the distillation UNIQUE(ticker, baseline_kind, as_of) collision is
# unreachable on the scheduled path. The deliberative pipeline is thesis formation / position decisions — an
# inherently low-frequency job. Real-time risk on open positions is owned by the
# continuous monitor (config/continuous_monitor.yaml), not by an intraday
# pipeline cadence. `off_hours_rolling` and `weekend_saturday` stay valid run
# types (overlays + enum members remain) but are deliberately unscheduled.
triggers:
  # market_open fires at 09:35 ET — just after the 09:30 NYSE open, once the
  # opening auction settles, so the run anchors on fresh post-open live prices.
  # (Firing at 09:00 pre-open drew wide/distrusted pre-market quotes: the
  # bar-divergence / broken-spread gate fell back to recorded bars. Moved
  # 09:00 → 09:35 ET on 2026-06-02; the trigger was renamed pre_open →
  # market_open in ALP-822 so the label matches the post-open behavior.)
  market_open:          "35 9 * * mon-fri"    # 09:35 ET — after the open, fresh live quotes
  # `market_hours_rolling` is now a single mid-day fire (a slight misnomer the
  # name keeps to avoid churning the enum / wire-schema / DB CHECK vocab).
  market_hours_rolling: "0 13 * * mon-fri"    # 13:00 ET — single mid-day opportunity / thesis read
  pre_close:            "0 15 * * mon-fri"    # 15:00 ET — EOD risk reduction; SOLE owner of the close slot
  weekend_sunday:       "0 18 * * sun"        # 18:00 ET Sun — pre-week positioning
