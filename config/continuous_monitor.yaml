# Continuous-monitor process tunables. Class A per the configuration-management
# taxonomy — operator-tuned, validated at load. See
# docs/design/05-execution-layer/continuous-monitor-runtime.md for the process
# shape these knobs configure and parent issue ALP-123 § Pre-resolved
# decision (E) for the source of the named defaults.

# Cadence at which the breach-evaluation loop (story 03b) wakes and walks the
# active rule set.
breach_evaluation_cadence_seconds: 60

# Scheduled cadence for the greeks-refresh task (story 03a); move-based triggers
# are gated by the threshold below.
greeks_refresh_interval_minutes: 15

# Underlying move (percent, cumulative from the last refresh) that forces an
# out-of-cadence greeks recompute. Decision (C): measured against the live
# stream the monitor already consumes — no extra subscription.
greeks_refresh_underlying_move_threshold_pct: 2.0

# Per-loop inspection cadence for the greeks-refresh task (story 03a). Distinct
# from greeks_refresh_interval_minutes which is the per-position scheduled
# refresh interval — this knob is how often the task wakes to evaluate
# triggers and consider due positions. Default 30s balances move-trigger
# responsiveness against database / IV-provider load during heavy chains.
greeks_refresh_inspection_cadence_seconds: 30

# Per-loop inspection cadence for the options bracket-stop watcher (story 04c).
# The watcher reads spot from the in-memory underlying-price cache + the
# position's greeks; the cadence trades fire latency against repeated
# evaluation cost across the open option / strategy positions. Default 1s
# balances near-tick-fast responsiveness against per-cycle iteration cost.
bracket_stop_evaluation_cadence_seconds: 1.0

# Per-loop inspection cadence for the entry-window expiry watcher (ALP-737).
# The watcher reads PENDING_ENTRY brackets carrying an entry_window_deadline and
# auto-cancels any whose deadline has passed (the analyst's patient-entry
# window). A patient-entry deadline is coarse (hours), so this is far slower
# than the price-driven bracket-stop cadence — a once-a-minute sweep is ample.
entry_window_evaluation_cadence_seconds: 60.0

# Live underlying-price stream provider. Single-value Literal today; decision (B)
# pins Alpaca StockDataStream / IEX after the 2026-05-10 paper-account smoke
# test. Story 02b's vendor surface lives here.
underlying_stream_provider: alpaca-iex

# Cadence at which the underlying-price stream task (story 02b) re-computes its
# subscription target set against the open-position set and issues
# subscribe_quotes / unsubscribe_quotes deltas to alpaca-py. Default 30 s
# balances new-position responsiveness against websocket-control-frame load.
subscription_refresh_seconds: 30

# Websocket reconnect ceiling per session (story 02b / 02c). Once exhausted the
# supervisor's task raises and NSSM's restart policy kicks in.
max_reconnect_attempts: 5

# Per-task cancellation budget the asyncio supervisor enforces at shutdown.
# Stops a task that swallows CancelledError from stalling the process so NSSM
# can restart promptly. Defaulted at 5s per ALP-432 scope section 7.
supervisor_shutdown_timeout_seconds: 5

# Trading-day local time at which the borrow-accrual tick (story 04 of
# ALP-715, continuous-monitor responsibility 4f) fires once per trading day.
# Iterates every OPEN SHORT-equity position, resolves the live borrow fee,
# accrues today's cost against the live notional, and emits one
# BORROW_COST_ACCRUED activity-log entry per position. Off-hours and
# weekends the timer sleeps to the next trading-day close. Format: 24-hour
# HH:MM ET (US/Eastern wall clock, matching the rest of the monitor).
# Source: ALP-715 § Pre-resolved decision (E).
borrow_accrual_tick_local_time: "16:00"
