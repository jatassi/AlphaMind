# Market-hours rolling (every 2h between 9:30 and 16:00 ET) — full roster at
# normal adaptive budget per docs/design/configuration-management.md
# § run_types/<trigger>.yaml.

agents:
  enabled:
    - tech_semis_researcher
    - financials_researcher
    - energy_researcher
    - qualitative_researcher
    - adaptive_researcher
    - synthesizer
    - analyst
    - strategist
    - portfolio_manager
  overrides:
    adaptive_researcher:
      cumulative_tool_call_limit: 20
      cumulative_tool_token_budget: 3000
      # 2026-05-29: base 900s (config/agents.yaml) tripped a zero-token
      # TimeoutFailure on inv-20260529T133000Z-b706d98d — the SDK was actively
      # streaming the whole 905s, not stalled. Tool phase finished healthy at
      # 122s (18 calls, same as clean baselines); the overrun was pure
      # extended-thinking final-brief synthesis driven by a high anomaly count
      # (36 distillation + 9 sector → 14,081-char bundle vs ~10,900 on runs that
      # passed). Clean market-hours runs already brush the ceiling (821.7s on
      # 2026-05-28). Raised to 1200s for ~30% headroom on high-anomaly days;
      # the subprocess parent-side kill auto-tracks this (+30s slack) and the
      # worker teardown cap is already 1200s.
      # 2026-06-05 (ALP-839): the earlier "top-N anomaly cap" follow-up named the
      # wrong lever. For the *sector* researchers the bundle driver is per-ticker
      # sector-indicator rendering, not anomaly count — addressed by ALP-839
      # (non-calibrated-block compression + the tech_semis 900→1200s bump in
      # config/agents.yaml). The *adaptive* researcher's anomaly-input discipline
      # is owned by ALP-706 (severity-aware triage), not a top-N cap here.
      latency_budget_seconds: 1200

qualitative_researcher:
  news_digest:
    top_n_per_sector: 5
    top_n_high_priority: 3
