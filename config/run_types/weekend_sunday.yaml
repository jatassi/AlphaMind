# Weekend Sunday (~18:00 ET) — position before Monday's pre-market open and
# the Sunday-evening earnings-preannouncement window. Full roster including
# adaptive_researcher per docs/design/configuration-management.md
# § run_types/<trigger>.yaml.

agents:
  enabled:
    - tech_semis_researcher
    - financials_researcher
    - energy_researcher
    - qualitative_researcher
    - adaptive_researcher
    - synthesizer
    - analyst
    - strategist
    - portfolio_manager
  overrides:
    adaptive_researcher:
      cumulative_tool_call_limit: 20
      cumulative_tool_token_budget: 3000

qualitative_researcher:
  news_digest:
    top_n_per_sector: 5
    top_n_high_priority: 3
