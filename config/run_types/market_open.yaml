# Market-open (09:35 AM ET, just after the 09:30 open) — high-density: overnight
# news, pre-market flow, FOMC overnight moves. Full roster including the adaptive researcher with the
# expanded tool-loop budget per docs/design/configuration-management.md
# § run_types/<trigger>.yaml.

agents:
  enabled:
    - tech_semis_researcher
    - financials_researcher
    - energy_researcher
    - qualitative_researcher
    - adaptive_researcher
    - synthesizer
    - analyst
    - strategist
    - portfolio_manager
  overrides:
    adaptive_researcher:
      cumulative_tool_call_limit: 25
      cumulative_tool_token_budget: 4000
      latency_budget_seconds: 300

qualitative_researcher:
  news_digest:
    top_n_per_sector: 5
    top_n_high_priority: 3
