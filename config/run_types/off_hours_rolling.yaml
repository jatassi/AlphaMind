# Off-hours rolling (every 4h outside market hours, mon-fri) — low-density;
# adaptive_researcher omitted because overnight signal density drops and
# persistent anomalies are picked up on the next pre-open run, per
# docs/design/configuration-management.md § run_types/<trigger>.yaml.

agents:
  enabled:
    - tech_semis_researcher
    - financials_researcher
    - energy_researcher
    - qualitative_researcher
    - synthesizer
    - analyst
    - strategist
    - portfolio_manager

qualitative_researcher:
  news_digest:
    top_n_per_sector: 3
    top_n_high_priority: 3
