# Sample-size thresholds for the feedback-loop analytics spine.
# See docs/design/feedback-loop.md § Cadence and § Process metrics vs. outcome
# metrics, and ALP-131 Pre-resolved decision (J): only the sample-size
# thresholds are operator-tunable here. Metric windows and 80% posterior bands
# are definitional (encoded in the metric types, not config); notable-shift
# thresholds live in config/digest.yaml.
#
# Each key is the minimum number of resolved theses an outcome-tier metric needs
# before it reads as signal; below the floor the metric reports
# "needs N more observations" rather than a noise-dominated point estimate.

min_resolved_theses_monthly:   30   # monthly-window outcome metrics (e.g. P/L attribution)
min_resolved_theses_quarterly: 60   # quarterly-window outcome metrics (e.g. conviction / status calibration)
