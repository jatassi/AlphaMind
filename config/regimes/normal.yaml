# Normal regime — VIX 14–22.
#
# Base regime: every multiplier is 1.0 by construction. Storing the uniform
# table explicitly keeps the resolver's cascade arithmetic uniform across
# regimes (no special-casing the base) per story 04b's Notes.

vix_range: [14, 22]
multipliers:
  position_max_size_pct:           1.00
  position_max_loss_equity_pct:    1.00
  position_max_loss_options_pct:   1.00
  sector_concentration_pct:        1.00
  net_long_pct:                    1.00
  net_short_pct:                   1.00
  gross_exposure_pct:              1.00
  daily_drawdown_pct:              1.00
  cumulative_drawdown_pct:         1.00
  options_delta_pct:               1.00
  portfolio_theta_pct_per_day:     1.00
  portfolio_vega_pct_per_iv_point: 1.00
  total_short_pct:                 1.00
  single_short_max_pct:            1.00
  borrow_cost_budget_pct_per_day:  1.00
  min_cash_reserve_pct:            1.00
  correlation_max:                 1.00
  thesis_dependency_flag_pct:      1.00
  pending_order_capital_pct:       1.00
transition:
  tighten_on_entry: immediate
  loosen_on_exit:   linear_over_invocations_3
