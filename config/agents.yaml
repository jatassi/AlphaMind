# Per-agent LLM configuration — single source of truth for the nine pipeline agents.
#
# Schema lives in src/alphamind/config/models/agents.py (story 03i). Tool names
# follow the registered-tool naming convention from the analysis-layer specs.
# Latency and token budgets reflect design-doc defaults
# (docs/design/cost-and-rate-limit-modeling.md § Per-invocation token aggregate
#  and § Latency budgets); per-profile overrides live in profiles/<profile>.yaml.
#
# Model assignments follow docs/design/cost-and-rate-limit-modeling.md
# § Per-invocation agent surface — Opus for the decision layer, Sonnet for the
# analysis layer. Haiku is unused but available for cap-pressure switchovers.

agents:

  # --- Decision layer (Opus) -------------------------------------------------

  analyst:
    model: claude-opus-4-7
    prompt: prompts/decision/analyst.md
    # 2026-05-25 debug-e2e: analyst hit budget_timeout at 305.07s — SDK trace
    # shows continuous productive work (ThinkingBlocks 32s/50s/65s/68s
    # interleaved with ~10 retrieve_brief + 2 validate_guardrail tool calls;
    # no silent stall). Genuine extended-thinking + tool-loop latency under
    # the production-faithful synthetic portfolio. Raised 300s → 500s.
    latency_budget_seconds: 500
    context_token_budget: 8000
    # Each recommendation serializes to ~500–800 tokens with the rich nested
    # shape (instrument + entry_order + position_size + target +
    # invalidation_legs + 4 narrative fields + guardrail_validation_result
    # mirror). 1–3 recommendations sit at 1500–2500 tokens with no headroom
    # for retry or empty-day clarifications. 4000 leaves ~50% headroom (ALP-291).
    # Preemptive bump 2026-05-09: 4000 → 6000 (~50% headroom over prior cap)
    # mirroring the analysis-layer ALP-288 drift pattern; latency 180→300 to
    # match the strategist/PM cadence after their similar bumps.
    # 2026-05-26 fresh-start (--fresh-start --debug-e2e) run: analyst SDK call
    # failed with "API Error: Claude's response exceeded the 6000 output token
    # maximum" — ResultMessage usage showed output_tokens=30400 across 15 turns
    # (one turn wanted to emit >6000 in a single response). Fresh-start fills a
    # $100K book from zero positions vs synthetic's 8-position 1–3-recommendation
    # regime — fundamentally different output volume. Raised to 100000 to
    # explicitly support the fresh-start regime and provide deep headroom for
    # the per-turn enumeration of OPEN recommendations.
    output_token_budget: 100000
    tools: [retrieve_brief, validate_guardrail]

  strategist:
    model: claude-opus-4-7
    prompt: prompts/decision/strategist.md
    # 180s proved too tight in live e2e; the model emits ThinkingBlocks for
    # 60+s between actions on the strategist task (4+ positions × thesis
    # classification + cited rationale + cross-position observations).
    # Raised to 300s 2026-05-05 after PR #22 verify-strategist timed out at
    # 185s with no ResultMessage. Raised again to 480s 2026-05-05 after
    # ALP-312's prompt clarification on remedy_flag scope pushed the
    # defensive_posture scenario (6 positions) into a 305s+ extended-thinking
    # phase before the first token — see ALP-311/312 verification.
    # 2026-05-09 e2e: defensive_posture again exceeded 480s (TimeoutFailure
    # at 485s with 0 output tokens) — the prompt has continued to grow the
    # extended-thinking budget. Raised to 900s to match adaptive/PM.
    latency_budget_seconds: 900
    context_token_budget: 8000
    # Design-doc estimate (1,200–2,500 tokens for full-system) understates real
    # output. 4000 truncated the normal-scenario response in PR #22 verify-strategist
    # at stop_sequence; raised to 16000 2026-05-05 for comfortable headroom across
    # all three scenarios (normal, defensive_posture, emergency-invocation) plus
    # retry path. Output goes nowhere external — generated tokens ARE the work
    # product, so a generous cap is cheap relative to a re-run.
    # Preemptive bump 2026-05-09: 16000 → 24000 (~50% headroom over prior cap)
    # mirroring the qualitative/adaptive ALP-288 drift; output dynamics are
    # similar across the JSON-Schema-mode agents.
    output_token_budget: 24000
    tools: [retrieve_brief, validate_guardrail, validate_guardrail_batch]

  # portfolio_manager budgets raised 2026-05-05 (ALP-321, operator directive).
  # Rationale:
  #   latency_budget_seconds 240 → 600: the four-MCP-server tool loop
  #     (retrieve_brief + validate_guardrail + get_thesis_components +
  #     submit_envelope) each carry network round-trips; under the
  #     synchronous-rejection retry path a second full tool-loop pass is
  #     required, doubling observed wall time versus the analyst/strategist
  #     two-tool loop. 600s matches the analysis-layer latency cap and leaves
  #     headroom for the retry path without an abort.
  #   context_token_budget 12000 → 16000: PM ingests the full analyst
  #     recommendation set plus thesis components per instrument; at peak
  #     (3 analysts × 3 recommendations) the context assembly reaches the
  #     12 000-token ceiling before the model begins reasoning. 16 000 covers
  #     the observed peak and mirrors cost-and-rate-limit-modeling.md
  #     § Per-invocation token aggregate.
  #   output_token_budget 3000 → 16000: the envelope payload (per-instrument
  #     sizing + allocation + narrative) serialises far beyond 3 000 tokens
  #     in the normal three-instrument scenario; generous cap is cheap
  #     relative to a re-run and mirrors the strategist precedent (ALP-301).
  portfolio_manager:
    model: claude-opus-4-7
    prompt: prompts/decision/pm.md
    # Preemptive bump 2026-05-09: latency 600→900 and output 16000→24000
    # mirroring the strategist + analysis-layer ALP-288 drift fixes.
    latency_budget_seconds: 900
    context_token_budget: 16000
    output_token_budget: 24000
    tools: [retrieve_brief, validate_guardrail, validate_guardrail_batch, get_thesis_components, submit_envelope]

  # --- Analysis layer (Sonnet) ----------------------------------------------

  tech_semis_researcher:
    model: claude-sonnet-4-6
    prompt: prompts/analysis/tech_semis_researcher.md
    latency_budget_seconds: 600
    context_token_budget: 8000
    # Sonnet 4.6 extended thinking dominates output; observed actuals across
    # recent end-to-end runs range 8.5K–24.7K across the three sectors
    # (financials variance widens under degraded upstream inputs). Cap covers
    # the observed maximum and mirrors the qualitative/adaptive recalibration
    # logic from ALP-285; corrective-retry path is not budgeted in.
    output_token_budget: 24000
    tools: []

  financials_researcher:
    model: claude-sonnet-4-6
    prompt: prompts/analysis/financials_researcher.md
    latency_budget_seconds: 600
    context_token_budget: 8000
    # Sonnet 4.6 extended thinking dominates output; observed actuals across
    # recent end-to-end runs range 8.5K–24.7K across the three sectors
    # (financials variance widens under degraded upstream inputs). Cap covers
    # the observed maximum and mirrors the qualitative/adaptive recalibration
    # logic from ALP-285; corrective-retry path is not budgeted in.
    output_token_budget: 24000
    tools: []

  energy_researcher:
    model: claude-sonnet-4-6
    prompt: prompts/analysis/energy_researcher.md
    latency_budget_seconds: 600
    context_token_budget: 8000
    # Sonnet 4.6 extended thinking dominates output; observed actuals across
    # recent end-to-end runs range 8.5K–24.7K across the three sectors
    # (financials variance widens under degraded upstream inputs). Cap covers
    # the observed maximum and mirrors the qualitative/adaptive recalibration
    # logic from ALP-285; corrective-retry path is not budgeted in.
    output_token_budget: 24000
    tools: []

  qualitative_researcher:
    model: claude-sonnet-4-6
    prompt: prompts/analysis/qualitative_researcher.md
    # Healthy calls run 250-365s (e2e sdk_trace.jsonl, 2026-05-21): Sonnet's
    # extended thinking produces 150s+ silent gaps between SDK messages. The
    # prior 360s sat inside that healthy range and intermittently killed
    # sound calls mid-think (surfacing as a zero-token TimeoutFailure).
    # Raised to 600s for parity with the sector researchers and real headroom.
    latency_budget_seconds: 600
    context_token_budget: 8000
    # Sonnet 4.6 emits ~4400 tokens of extended thinking before brief text;
    # cap covers thinking + the design-doc 300–600 brief target. Post-ALP-288
    # JSON-Schema mode produces denser narrative threads (in-context refs +
    # implication blocks per thread); 2026-05-09 e2e run observed 16600
    # output tokens with 4 substantive threads. Re-baselined to 20000 for
    # ~20% headroom (mirrors the adaptive_researcher re-baseline pattern).
    output_token_budget: 20000
    # social_sentiment deferred per ALP-111 — Qual2 storage not yet provisioned.
    tools: [news_search, prediction_markets, earnings_commentary]
    cumulative_tool_call_limit: 15
    cumulative_tool_token_budget: 4000
    tool_caps:
      news_search: 8         # primary investigative tool; highest cap
      prediction_markets: 4  # follow-up on snapshot deltas
      earnings_commentary: 4 # one per universe name reporting in-window

  adaptive_researcher:
    model: claude-sonnet-4-6
    prompt: prompts/analysis/adaptive_researcher.md
    # 600s tripped TimeoutFailure on 2026-05-09 e2e run after the output budget
    # was raised to 36000 — Sonnet generated past 600s. Raised to 900s.
    latency_budget_seconds: 900
    context_token_budget: 4000
    # Extended thinking (~4400 tok) plus the JSON-Schema-mode brief itself.
    # Post-ALP-288 the brief is JSON instead of markdown and Sonnet routinely
    # produces 4-5 substantive investigation threads with detailed findings.
    # First clean post-migration verifier run observed 21537 output tokens; cap
    # initially set to 24000 for ~10% headroom. 2026-05-09 e2e run observed
    # 31222 output tokens with 5 substantive threads — re-baselined to 36000
    # for ~15% headroom. 2026-05-16 e2e run observed 36497 output tokens with
    # 9 substantive threads (1.4% overshoot of the prior cap) — re-baselined to
    # 40000 for ~10% headroom on the new 9-thread baseline. Continue to
    # re-baseline if runs trend higher.
    output_token_budget: 40000
    # social_sentiment + options_flow deferred — Qual2 + Q2 storage not yet provisioned.
    tools:
      - news_search
      - ticker_deep_pull
      - prediction_markets
      - sec_lending
      - short_interest
      - earnings_calendar
      - macro_data
    cumulative_tool_call_limit: 25
    cumulative_tool_token_budget: 4000
    tool_caps:
      news_search: 10
      ticker_deep_pull: 5
      prediction_markets: 5
      sec_lending: 3
      short_interest: 3
      earnings_calendar: 5
      macro_data: 5

  synthesizer:
    model: claude-sonnet-4-6
    prompt: prompts/analysis/synthesizer.md
    # 2026-05-21 e2e run observed a healthy 520s call against the prior 540s
    # cap — 19s of headroom. Same too-tight edge that bit qualitative; raised
    # to 900s for parity with adaptive_researcher and extended-thinking room.
    latency_budget_seconds: 900
    context_token_budget: 12000
    # Extended thinking (~4400 tok) plus the synthesizer's prose response.
    # Preemptive bump 2026-05-09: 8000 → 14000 to mirror the qualitative/adaptive
    # ALP-288 drift pattern (denser JSON-Schema outputs across the analysis layer).
    output_token_budget: 14000
    # tools intentionally empty: synthesizer's portfolio-state and retrieve_brief
    # tools are wired at the harness level via per-invocation closures over the
    # per-call RetrievalStore + SynthesizerPortfolioStateReader. See ALP-114
    # § Notes for the orchestrator — per-invocation MCP wiring.
    tools: []
